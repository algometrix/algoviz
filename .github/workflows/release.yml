name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token stored in
# repository secrets at all. Configure the publisher once at
# https://pypi.org/manage/project/algoviz/settings/publishing/ with:
#   owner: algometrix, repo: algoviz, workflow: release.yml, environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the tag matches the version in pyproject.toml
        # A tag that disagrees with the packaged version ships something
        # nobody can reproduce from the repo, so fail before building.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv version --short)"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag v$tag does not match version $packaged"
            exit 1
          fi

      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
